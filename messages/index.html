<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Verse People &amp; Places Extractor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, "Helvetica Neue", sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    form { display: flex; gap: .5rem; margin: 1rem 0; }
    input { flex: 1; padding: .5rem; font-size: 1rem; }
    button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
    #msg { color: #b00; min-height: 1.5em; }
    pre { background: #f5f5f5; padding: 1rem; overflow: auto; max-height: 65vh; font-size: .85rem; }
    footer { margin-top: 2rem; font-size: .8rem; color: #666; border-top: 1px solid #ddd; padding-top: .8rem; }
  </style>
</head>
<body>
  <h1>聖書箇所から人物・場所を抽出</h1>
  <p>例: <code>Acts.16.11-18</code> / <code>Acts.16.11-17.5</code> / <code>Acts.16</code>（章全体）</p>
  <form id="f">
    <input id="q" value="Acts.16.11-18" autocomplete="off" aria-label="聖書箇所">
    <button>抽出</button>
    <button type="button" id="copy">コピー</button>
    <button type="button" id="dl">ダウンロード</button>
  </form>
  <div id="msg"></div>
  <pre id="out">[]</pre>
  <footer>
    Data: <a href="https://github.com/robertrouse/theographic-bible-metadata">Theographic Bible Metadata</a>
    (<a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>).
    Original sources are listed in the
    <a href="https://github.com/robertrouse/theographic-bible-metadata/blob/master/docs/data-source-bibliography.md">bibliography</a>.
  </footer>
  <script src="app.js"></script>
</body>
</html>
