<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Verse Person Graph</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, "Helvetica Neue", sans-serif; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1rem 0; }
    input { flex: 1; min-width: 12rem; padding: .5rem; font-size: 1rem; }
    button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
    #msg { color: #b00; min-height: 1.5em; }
    #view { border: 1px solid #ddd; overflow: auto; max-height: 75vh; }
    #view svg { display: block; }
    footer { margin-top: 2rem; font-size: .8rem; color: #666; border-top: 1px solid #ddd; padding-top: .8rem; }
  </style>
</head>
<body>
  <h1>聖書箇所の人物関係図</h1>
  <p>例: <code>Acts.16.11-18</code> / <code>Matt.1</code> / <code>Gen.25.19-26</code>。実線の箱は範囲内の人物、破線の箱は親として補った人物です。赤線は配偶者、黒線は親子、点線はきょうだいです。</p>
  <form id="f">
    <input id="q" value="Acts.16.11-18" autocomplete="off" aria-label="聖書箇所">
    <button>作図</button>
    <button type="button" id="svg">SVG</button>
    <button type="button" id="png">PNG</button>
    <button type="button" id="pdf">PDF</button>
  </form>
  <div id="msg"></div>
  <div id="view"></div>
  <footer>
    Data: <a href="https://github.com/robertrouse/theographic-bible-metadata">Theographic Bible Metadata</a>
    (<a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>).
    Original sources are listed in the
    <a href="https://github.com/robertrouse/theographic-bible-metadata/blob/master/docs/data-source-bibliography.md">bibliography</a>.
  </footer>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
